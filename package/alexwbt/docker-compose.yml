
services:

  nginx-http:
    image: nginx:1.25.4-alpine
    container_name: nginx-http
    restart: always
    ports:
      - 80:80
    volumes:
      - ${WORK_DIR}/config/nginx_http.conf:/etc/nginx/conf.d/nginx_http.conf:ro
      - ${RUNTIME_DIR}/certbot/www:/var/www/certbot/:ro

  certbot:
    image: certbot/certbot:v4.0.0
    container_name: certbot
    volumes:
      - ${RUNTIME_DIR}/certbot/www/:/var/www/certbot/:rw
      - ${RUNTIME_DIR}/certbot/conf/:/etc/letsencrypt/:rw

  nginx:
    image: nginx:1.25.4-alpine
    container_name: nginx
    restart: always
    ports:
      - 443:443
    volumes:
      - ${WORK_DIR}/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${RUNTIME_DIR}/certbot/conf/:/etc/nginx/ssl/:ro

  code-activity-server:
    image: code-activity-server:latest
    container_name: code-activity-server
    restart: always
    volumes:
      - "${RUNTIME_DIR}/code-activity-server/repositories:/app/repositories"
      - "/root/.ssh:/root/.ssh"
    environment:
      ACTIVITY_FILE_FILTER: "\\.(ts|tsx|js|jsx|java|cpp|hpp|c|h|fs|vs|txt|json|sh|py|dockerfile)$"

  alexwbt-ui:
    restart: always
    image: alexwbt-ui:latest
    container_name: alexwbt-ui
    volumes:
      - "${WORK_DIR}/config/alexwbt-ui.js:/app/dist/config.js:ro"

  hermes:
    restart: always
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_INSECURE=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=Hermes3214
    volumes:
      - ${RUNTIME_DIR}/hermes/data:/opt/data
      - /root/workspace:/workspace
    command: gateway run

  tunnel:
    restart: always
    image: lscr.io/linuxserver/openssh-server:amd64-10.2_p1-r0-ls217
    container_name: tunnel
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      SUDO_ACCESS: false
      USER_NAME: user
    ports:
      - 2222:2222
    volumes:
      - ${WORK_DIR}/config/tunnel/sshd_config:/config/sshd/sshd_config
      - ${WORK_DIR}/config/tunnel/authorized_keys:/config/.ssh/authorized_keys
